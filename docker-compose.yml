services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clipfolio
      POSTGRES_PASSWORD: clipfolio
      POSTGRES_DB: clipfolio
    volumes:
      - clipfolio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clipfolio
      MINIO_ROOT_PASSWORD: clipfolio123
    ports:
      - "9000:9000" # S3 API - the browser fetches video segments from here directly
      - "9001:9001" # MinIO web console, optional
    volumes:
      - clipfolio-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 clipfolio clipfolio123 &&
      mc mb -p local/clipfolio-videos &&
      mc anonymous set download local/clipfolio-videos
      "

  clipfolio:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      CLIPFOLIO_ADDR: ":8080"
      CLIPFOLIO_DATABASE_URL: "postgres://clipfolio:clipfolio@postgres:5432/clipfolio?sslmode=disable"
      CLIPFOLIO_S3_ENDPOINT: "http://minio:9000"
      CLIPFOLIO_S3_REGION: "us-east-1"
      CLIPFOLIO_S3_BUCKET: "clipfolio-videos"
      CLIPFOLIO_S3_ACCESS_KEY: "clipfolio"
      CLIPFOLIO_S3_SECRET_KEY: "clipfolio123"
      CLIPFOLIO_S3_FORCE_PATH_STYLE: "true"
      CLIPFOLIO_S3_PUBLIC_BASE_URL: "http://localhost:9000/clipfolio-videos"
      CLIPFOLIO_SETUP_TOKEN: "${CLIPFOLIO_SETUP_TOKEN:-}"

volumes:
  clipfolio-postgres:
  clipfolio-minio:
